[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "stdenv.cc.cc.lib", "nss", "freetype", "harfbuzz", "liberation_ttf", "glib", "nspr", "at-spi2-atk", "cups", "dbus", "libdrm", "expat", "libxkbcommon", "mesa", "alsa-lib"]

[phases.install]
cmds = [
  "npm ci",
  "pip install -r requirements.txt --break-system-packages"
]

[variables]
LD_LIBRARY_PATH = "${stdenv.cc.cc.lib}/lib"
PUPPETEER_CACHE_DIR = "/app/.cache/puppeteer"

[start]
cmd = "node index.js"